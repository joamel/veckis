<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Outfit; font-weight: 700; src: url(Outfit_700Bold.ttf); }
@font-face { font-family: Outfit; font-weight: 600; src: url(Outfit_600SemiBold.ttf); }
html,body { margin:0; width:1920px; height:823px; overflow:hidden; }
body { background: radial-gradient(ellipse 900px 700px at 68% 40%, #2a5040 0%, #1d3b2e 55%, #16301f 100%); font-family: Outfit, sans-serif; position:relative; }
.text { position:absolute; left:230px; top:170px; width:760px; }
.brand { display:flex; align-items:center; gap:22px; }
.brand img { width:92px; height:92px; border-radius:22px; }
.brand span { color:#fff; font-weight:700; font-size:54px; letter-spacing:-1px; }
h1 { color:#fff; font-weight:700; font-size:84px; line-height:1.04; letter-spacing:-2px; margin:46px 0 0; }
h1 em { font-style:normal; color:#cde66b; }
p { color:#c9d8c0; font-weight:600; font-size:30px; line-height:1.4; margin:28px 0 0; }
.phone { position:absolute; width:300px; border-radius:46px; background:#0d1f16; padding:9px; box-shadow: 0 40px 80px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.06); }
.phone img { display:block; width:300px; border-radius:38px; }
.p1 { left:960px; top:190px; transform: rotate(-6deg); }
.p2 { left:1255px; top:110px; z-index:2; }
.p3 { left:1550px; top:190px; transform: rotate(6deg); }
</style></head><body>
<div class="text">
  <div class="brand"><img src="icon.png"><span>Handlis</span></div>
  <h1>Från recept till<br><em>inköpslista</em></h1>
  <p>Planera veckans mat och handla<br>i butikens ordning – tillsammans.</p>
</div>
<div class="phone p1"><img src="03.jpg"></div>
<div class="phone p2"><img src="07.jpg"></div>
<div class="phone p3"><img src="05.jpg"></div>
</body></html>
