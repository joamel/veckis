<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Outfit; font-weight: 700; src: url(Outfit_700Bold.ttf); }
@font-face { font-family: Outfit; font-weight: 600; src: url(Outfit_600SemiBold.ttf); }
html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; font-family: Outfit, 'Segoe UI Emoji', sans-serif; background: #1d3b2e; }
/* Profilrutnätet visar mitten i 3:4 (y 120–840 av 960); allt viktigt ligger där. */
.wrap { position: absolute; left: 0; right: 0; top: 150px; text-align: center; padding: 0 36px; }
.big { color: #fff; font-weight: 700; font-size: 74px; letter-spacing: -2px; line-height: 1; transform: rotate(-3deg); }
.emo { font-family: 'Segoe UI Emoji'; font-size: 60px; }
.sub { color: #cde66b; font-weight: 700; font-size: 30px; letter-spacing: -0.5px; line-height: 1.15; margin-top: 20px; }
.phone { position: absolute; left: 50%; width: 250px; margin-left: -132px; top: 400px; padding: 7px; border-radius: 40px; background: #0d1f16; box-shadow: 0 30px 60px rgba(0,0,0,.4); transform: rotate(4deg); }
.phone img { display: block; width: 100%; border-radius: 33px; }
</style></head><body>
<div class="wrap">
  <div class="big" style="font-size:62px">Glömt grädden.. <span class="emo">🙃</span></div>
  <div class="sub">Så slipper du åka<br>tillbaka till affären</div>
</div>
<div class="phone"><img src="05.jpg"></div>
</body></html>
