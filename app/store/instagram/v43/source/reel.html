<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Outfit; font-weight: 700; src: url(Outfit_700Bold.ttf); }
@font-face { font-family: Outfit; font-weight: 600; src: url(Outfit_600SemiBold.ttf); }
html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; font-family: Outfit, sans-serif; }
body { background: #1d3b2e; }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 40px; box-sizing: border-box; opacity: 0; }
.big { color: #fff; font-weight: 700; font-size: 64px; letter-spacing: -2px; line-height: 1.02; }
.lime { color: #cde66b; }
.mid { color: #fff; font-weight: 700; font-size: 40px; letter-spacing: -1px; line-height: 1.08; }
.sub { color: #c9d8c0; font-weight: 600; font-size: 19px; line-height: 1.4; margin-top: 14px; }
.step { color: #cde66b; font-weight: 700; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
.phone { position: absolute; left: 50%; width: 300px; margin-left: -157px; padding: 7px; border-radius: 44px; background: #0d1f16; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
.phone img { display: block; width: 100%; border-radius: 37px; }
.icon { width: 130px; height: 130px; border-radius: 30px; margin-bottom: 28px; }
.btn { margin-top: 26px; background: #cde66b; color: #1d3b2e; font-weight: 700; font-size: 20px; padding: 13px 26px; border-radius: 14px; }
</style></head><body>
<!-- Text hålls mellan y≈120 och y≈760 (av 960): Instagram lägger knappar och bildtext ovanpå resten. -->
<div class="layer" id="s1" style="justify-content:center;padding-bottom:120px">
  <div class="big">Söndag.</div>
  <div class="big lime" id="s1b" style="margin-top:8px">Vecka 43<br>börjar i morgon.</div>
</div>
<div class="layer" id="s2" style="justify-content:center;padding-bottom:120px">
  <div class="mid">Vad ska ni äta<br>i veckan?</div>
  <div class="sub">Tio minuter nu sparar<br>flera turer till affären.</div>
</div>
<div class="layer" id="s3" style="padding-top:120px">
  <div class="step">Steg 1</div>
  <div class="mid" style="font-size:34px;margin-top:8px">Lägg middagarna<br>på veckan</div>
  <div class="phone" id="p3" style="top:300px"><img src="07.jpg"></div>
</div>
<div class="layer" id="s4" style="padding-top:120px">
  <div class="step">Steg 2</div>
  <div class="mid" style="font-size:34px;margin-top:8px">Listan gör sig själv –<br>i butikens ordning</div>
  <div class="phone" id="p4" style="top:300px"><img src="05.jpg"></div>
</div>
<div class="layer" id="s5" style="justify-content:center;padding-bottom:120px">
  <div class="step">Steg 3</div>
  <div class="big" style="margin-top:10px">Handla<br><span class="lime">en gång.</span></div>
</div>
<div class="layer" id="s6" style="justify-content:center;padding-bottom:120px">
  <img class="icon" src="icon.png">
  <div class="mid">Planera vecka 43<br>i Handlis</div>
  <div class="btn">Länk i bion</div>
</div>
<script>
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
// [id, start, end] i sekunder; varje scen tonar in 0,35 s och ut 0,3 s.
const SCENES = [['s1', 0, 3.0], ['s2', 3.0, 5.4], ['s3', 5.4, 8.6], ['s4', 8.6, 11.8], ['s5', 11.8, 13.4], ['s6', 13.4, 15.5]];
window.setTime = t => {
  for (const [id, a, b] of SCENES) {
    const el = document.getElementById(id);
    const fin = ease((t - a) / 0.35), fout = id === 's6' ? 1 : 1 - ease((t - (b - 0.3)) / 0.3);
    el.style.opacity = Math.min(fin, fout);
    el.style.transform = `translateY(${(1 - fin) * 24}px)`;
  }
  document.getElementById('s1b').style.opacity = ease((t - 0.9) / 0.4);
  // Telefonerna glider upp och scrollar långsamt nedåt (bilden flyttas uppåt).
  for (const [id, a] of [['p3', 5.4], ['p4', 8.6]]) {
    const p = document.getElementById(id);
    const rise = ease((t - a) / 0.6);
    p.style.transform = `translateY(${(1 - rise) * 260 - Math.max(0, t - a - 0.6) * 18}px)`;
  }
};
setTime(0);
</script>
</body></html>
