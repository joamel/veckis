<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Outfit; font-weight: 700; src: url(Outfit_700Bold.ttf); }
@font-face { font-family: Outfit; font-weight: 600; src: url(Outfit_600SemiBold.ttf); }
html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; font-family: Outfit, 'Segoe UI Emoji', sans-serif; }
body { background: #1d3b2e; }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 40px; box-sizing: border-box; opacity: 0; }
.big { color: #fff; font-weight: 700; font-size: 72px; letter-spacing: -2px; line-height: 1.02; }
.lime { color: #cde66b; }
.mid { color: #fff; font-weight: 700; font-size: 36px; letter-spacing: -1px; line-height: 1.1; }
.sub { color: #c9d8c0; font-weight: 600; font-size: 24px; line-height: 1.35; margin-top: 18px; }
.emo { display: inline-block; font-family: 'Segoe UI Emoji', sans-serif; }
.phone { position: absolute; left: 50%; width: 290px; margin-left: -152px; padding: 7px; border-radius: 44px; background: #0d1f16; box-shadow: 0 30px 60px rgba(0,0,0,.4); }
.phone img { display: block; width: 100%; border-radius: 37px; }
.icon { width: 130px; height: 130px; border-radius: 30px; margin-bottom: 28px; }
.btn { margin-top: 26px; background: #cde66b; color: #1d3b2e; font-weight: 700; font-size: 20px; padding: 13px 26px; border-radius: 14px; }
</style></head><body>
<!-- Text hålls mellan y≈120 och y≈760 (av 960): Instagram lägger knappar och bildtext ovanpå resten. -->
<div class="layer" id="s1" style="justify-content:center;padding-bottom:120px">
  <div class="big" id="s1a">Söndag..</div>
  <div class="sub" id="s1b">…och ingen aning om vad<br>vi ska äta i veckan <span class="emo" id="sigh" style="font-size:34px">😮‍💨</span></div>
</div>
<div class="layer" id="s2" style="padding-top:120px">
  <div class="mid">Lägg till recept<br>på veckomenyn <span class="emo">🍝</span></div>
  <div class="phone" id="p2" style="top:290px"><img src="07.jpg"></div>
</div>
<div class="layer" id="s3" style="padding-top:120px">
  <div class="mid">Listan sorterar sig själv –<br><span class="lime">efter butikens ordning</span> <span class="emo">🛒</span></div>
  <div class="phone" id="p3" style="top:290px"><img src="05.jpg"></div>
</div>
<div class="layer" id="s4" style="justify-content:center;padding-bottom:120px">
  <div class="big" id="s4a">Handla<br>en gång.</div>
  <div class="mid lime" id="s4b" style="margin-top:22px;font-size:42px">– med Handlis <span class="emo" id="heart">💚</span></div>
</div>
<div class="layer" id="s5" style="justify-content:center;padding-bottom:120px">
  <img class="icon" id="icon" src="icon.png">
  <div class="mid" style="font-size:40px">Planera vecka 43<br>i Handlis <span class="lime">idag</span></div>
  <div class="btn">Länk i bion</div>
</div>
<script>
const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
// Lite överslag när saker poppar in – gladare än en ren intoning.
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);
const SCENES = [['s1', 0, 3.4], ['s2', 3.4, 6.8], ['s3', 6.8, 10.2], ['s4', 10.2, 12.8], ['s5', 12.8, 15.5]];
window.setTime = t => {
  for (const [id, a, b] of SCENES) {
    const fin = ease((t - a) / 0.3), fout = id === 's5' ? 1 : 1 - ease((t - (b - 0.25)) / 0.25);
    $(id).style.opacity = Math.min(fin, fout);
  }
  // "Söndag.." sjunker ihop lite, som en suck.
  const droop = ease((t - 0.5) / 0.8);
  $('s1a').style.transform = `scale(${back((t) / 0.5)}) translateY(${droop * 10}px) rotate(${droop * -3}deg)`;
  $('s1b').style.opacity = ease((t - 1.1) / 0.4);
  $('sigh').style.transform = `scale(${back((t - 1.5) / 0.5)}) rotate(${Math.sin(t * 6) * 8}deg)`;
  // Telefonerna studsar upp och scrollar sedan långsamt.
  for (const [id, a] of [['p2', 3.4], ['p3', 6.8]]) {
    const r = back((t - a) / 0.7);
    $(id).style.transform = `translateY(${(1 - r) * 300 - Math.max(0, t - a - 0.7) * 16}px)`;
  }
  $('s4a').style.transform = `scale(${back((t - 10.2) / 0.5)})`;
  $('s4b').style.opacity = ease((t - 10.9) / 0.3);
  // Hjärtat poppar in och slår sedan.
  const pop = back((t - 11.0) / 0.45), beat = 1 + Math.max(0, Math.sin((t - 11.5) * 9)) * 0.18 * (t > 11.5 ? 1 : 0);
  $('heart').style.transform = `scale(${pop * beat})`;
  $('icon').style.transform = `scale(${back((t - 12.8) / 0.5)}) rotate(${Math.sin((t - 12.8) * 5) * 4 * Math.max(0, 1 - (t - 12.8))}deg)`;
};
setTime(0);
</script>
</body></html>
