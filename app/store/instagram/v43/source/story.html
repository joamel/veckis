<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Outfit; font-weight: 700; src: url(Outfit_700Bold.ttf); }
@font-face { font-family: Outfit; font-weight: 600; src: url(Outfit_600SemiBold.ttf); }
html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; font-family: Outfit, 'Segoe UI Emoji', sans-serif; background: #1d3b2e; color: #fff; }
.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 150px 40px 0; box-sizing: border-box; }
.icon { width: 120px; height: 120px; border-radius: 28px; }
h1 { font-weight: 700; font-size: 44px; letter-spacing: -1px; line-height: 1.06; margin: 30px 0 0; }
.lime { color: #cde66b; }
p { color: #c9d8c0; font-weight: 600; font-size: 20px; line-height: 1.4; margin: 16px 0 0; }
/* Plats för Instagrams länkklistermärke (läggs till i appen). */
.slot { position: absolute; left: 70px; right: 70px; top: 600px; height: 92px; border: 2.5px dashed rgba(205,230,107,.55); border-radius: 22px; display: flex; align-items: center; justify-content: center; color: rgba(205,230,107,.7); font-weight: 600; font-size: 17px; }
.arrow { position: absolute; left: 0; right: 0; top: 520px; text-align: center; color: #cde66b; font-weight: 700; font-size: 22px; }
</style></head><body>
<div class="wrap">
  <img class="icon" src="icon.png">
  <h1>Planera vecka 43<br>i Handlis <span class="lime">idag</span> 💚</h1>
  <p>Veckomeny, inköpslista i butikens<br>ordning – för hela hushållet.</p>
</div>
<div class="arrow">Tryck här ↓</div>
<!-- Tom yta under pilen (y≈600–700) för länkklistermärket. -->
</body></html>
