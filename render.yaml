# Render kör BARA den statiska webb-PWA:n. Backenden och Postgres ligger på
# Railway (se railway.json); Neon är avvecklat.
#
# veckis-web är den enda tjänst som ska finnas här — den serverar handlis.app
# via Cloudflare. Den gamla backend-tjänsten "veckis" låg kvar som zombie efter
# flytten: den byggde om vid varje push till main och svarade 500 på allt
# DB-beroende, eftersom databasen var borta. Borttagen 2026-09-10.
#
# Dyker den upp igen är det för att någon återskapat den i Render-UI:t — den
# har aldrig stått i den här filen.
services:
  # PWA-frontend som statisk site. Build kör expo export --platform web och
  # publicerar dist/. SPA-rewrite gör att direct-URL till en route som inte
  # genererats (t.ex. /shopping/<id>) faller tillbaka till index.html, som
  # klient-side router sen läser path från.
  - type: web
    name: veckis-web
    env: static
    region: frankfurt
    rootDir: app
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /sw.js
        name: Service-Worker-Allowed
        value: /
      - path: /sw.js
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /manifest.json
        name: Cache-Control
        value: "public, max-age=3600"
      - path: /_expo/static/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
