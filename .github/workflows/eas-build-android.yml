name: EAS Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install
        working-directory: app

      - name: Setup EAS
        run: npm install -g eas-cli

      - name: Build with EAS
        run: eas build --platform android --profile preview --non-interactive
        working-directory: app
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Find APK/AAB
        id: artifact
        run: |
          # EAS build producerar artifact i olika paths beroende på konfiguration
          # Vanligt är dist/ eller build/
          if [ -f "app/dist/*.aab" ]; then
            echo "artifact=$(ls -1 app/dist/*.aab | head -1)" >> $GITHUB_OUTPUT
          elif [ -f "app/build/*.aab" ]; then
            echo "artifact=$(ls -1 app/build/*.aab | head -1)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        if: steps.artifact.outputs.artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ steps.artifact.outputs.artifact }}
          retention-days: 30
