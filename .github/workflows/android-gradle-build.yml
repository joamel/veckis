name: Android Gradle Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd app
          npm install --legacy-peer-deps

      - name: Build Android app
        run: |
          cd app
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalAnalyzeRelease -x lint
        env:
          _JAVA_OPTIONS: '-Xmx2g'

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            # Om assembleRelease misslyckades, försök med debug
            APK=$(find app/android -name "*debug.apk" -type f | head -1)
          fi
          if [ ! -z "$APK" ]; then
            echo "apk=$APK" >> $GITHUB_OUTPUT
            echo "Found APK: $APK"
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30

      - name: Create release note
        run: |
          echo "# Android Build Complete" > build-info.md
          echo "" >> build-info.md
          echo "APK: ${{ steps.apk.outputs.apk }}" >> build-info.md
          echo "Commit: ${{ github.sha }}" >> build-info.md
          echo "Branch: ${{ github.ref }}" >> build-info.md

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.md
