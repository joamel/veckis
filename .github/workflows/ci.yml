name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veckis
          POSTGRES_PASSWORD: veckis
          POSTGRES_DB: veckis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://veckis:veckis@localhost:5432/veckis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: backend

      # Städskripten ligger utanför tsconfig ("include": ["src"]) och
      # typkollades därför inte alls. En odeklarerad variabel upptäcktes först
      # när ett skript kraschade mitt i en skarp körning mot produktionsdatan.
      - name: TypeScript check (scripts)
        run: npm run typecheck:scripts
        working-directory: backend

      # CI körde ALDRIG testerna — varken backendens eller appens. Jobbet
      # installerade, byggde, migrerade och typkollade, och rapporterade
      # "success" utan att ett enda test hade körts. Postgres-tjänsten ovan
      # fanns redan, så integrationstesterna har allt de behöver.
      - name: Tests (backend)
        run: npm test
        working-directory: backend

      # shared saknade dessutom test-skript helt, så dess tester (enhets-
      # konvertering, plural, köksmått) kunde inte köras ens manuellt via npm.
      - name: Tests (shared)
        run: npm test
        working-directory: shared

  app:
    name: App TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: app

      - name: Tests (app)
        run: npm test
        working-directory: app

  deploy-web:
    name: "Deploy webb-PWA (Render). Backenden deployas av Railway."
    runs-on: ubuntu-latest
    needs: [backend, app]
    # Bara efter gröna tester, bara vid push till main (inte PR:er/develop).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Det här är den ENDA triggern för webb-PWA:n: render.yaml har
      # autoDeploy: false på veckis-web. Håll ihop de två — slås auto-deployen
      # på igen utan att det här steget tas bort byggs varje commit två gånger.
      #
      # Anledningen till att CI äger deployen i stället för Render: tjänsten har
      # rootDir: app, och Render hoppar över bygg när inget under den katalogen
      # ändrats. En commit som bara rör shared/ hade då aldrig nått webben, trots
      # att shared kompileras in i webbundlen av npm run build:web.
      #
      # Steget FELAR om secreten saknas. Tidigare skrev det bara en varning, och
      # den varningen lästes som att webben inte deployats fast Render då ännu
      # gjorde det åt oss. Nu finns ingen sådan reserv, så tystnad vore farligt.
      - name: Trigger web (PWA) deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_WEB_DEPLOY_HOOK }}" ]; then
            echo "::error::RENDER_WEB_DEPLOY_HOOK saknas — webb-PWA:n (veckis-web) deployades INTE, och ingen annan trigger finns kvar. Lägg till hooken (Render → veckis-web → Settings → Deploy Hook) under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Render svarar 409 när en deploy redan pågår för tjänsten. Det är
          # INTE ett fel, men det är heller inte klart: den pågående deployen
          # kan bygga en ÄLDRE commit, och då hade den här aldrig nått webben.
          # Därför väntas det ut i stället för att antingen fela direkt eller
          # rapportera falsk framgång. Fem försök à 60 s täcker ett normalt
          # statiskt bygge; håller konflikten i sig längre är något fel och då
          # ska jobbet fela högt.
          # OBS: bara ASCII i variabelnamn. "för in $(seq...)" gav
          # "not a valid identifier", loopen kördes aldrig, och jobbet föll rakt
          # ned i slutfelet som påstod att 409 hållit i sig i fem minuter — ett
          # larm om något som aldrig ens provats.
          kod=0
          for forsok in 1 2 3 4 5; do
            kod=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${{ secrets.RENDER_WEB_DEPLOY_HOOK }}")
            case "$kod" in
              200|201|202)
                echo "Webb-deploy triggad (HTTP $kod, försök $forsok)."
                exit 0
                ;;
              409)
                echo "En deploy pågår redan för veckis-web (409). Väntar 60 s, försök $forsok av 5."
                sleep 60
                ;;
              *)
                echo "::error::Deploy-hooken svarade HTTP $kod — webb-PWA:n deployades INTE."
                exit 1
                ;;
            esac
          done
          echo "::error::Deploy-hooken svarade $kod vid varje försök i fem minuter — en deploy verkar ha fastnat. Kontrollera veckis-web i Render."
          exit 1
