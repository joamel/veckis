name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veckis
          POSTGRES_PASSWORD: veckis
          POSTGRES_DB: veckis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://veckis:veckis@localhost:5432/veckis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: backend

  app:
    name: App TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: app

  deploy:
    name: "Deploy (web-PWA på Render; backend auto-deployas av Railway)"
    runs-on: ubuntu-latest
    needs: [backend, app]
    # Only after tests pass, only on a push to main (not PRs/develop).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Backenden deployas numera av Railway (auto-deploy från GitHub på push till
      # main) — ingen deploy-hook behövs här längre. Kvar: bara webb-PWA:n på Render.
      - name: Trigger web (PWA) deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_WEB_DEPLOY_HOOK }}" ]; then
            echo "::warning::RENDER_WEB_DEPLOY_HOOK saknas — webb-PWA:n (veckis-web) deployades INTE. Lägg till hooken (Render → veckis-web → Settings → Deploy Hook) i repo Settings → Secrets → Actions."
          else
            curl -fsSL -X POST "${{ secrets.RENDER_WEB_DEPLOY_HOOK }}"
            echo "Webb-deploy triggad."
          fi
