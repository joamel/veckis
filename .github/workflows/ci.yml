name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veckis
          POSTGRES_PASSWORD: veckis
          POSTGRES_DB: veckis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://veckis:veckis@localhost:5432/veckis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: backend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: backend

  app:
    name: App TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build --workspace=shared

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: app

# INGET deploy-jobb här, med flit. Båda tjänsterna deployar sig själva vid push
# till main: backenden av Railway, webb-PWA:n av Render (blueprint-tjänst i
# render.yaml, autoDeploy är på som standard).
#
# Ett hook-steg fanns här tidigare och skrev ut en varning när secreten
# RENDER_WEB_DEPLOY_HOOK saknades. Varningen var bokstavligt sann men
# vilseledande: webben deployades ändå, av Render själv, och varningen läste
# som att den INTE gjorde det. Den kostade en felsökning 2026-09-19.
#
# Lägg inte tillbaka steget utan att samtidigt sätta autoDeploy: false på
# tjänsten i render.yaml — annars byggs varje commit två gånger, och två
# triggers som gör samma sak är svåra att felsöka när en av dem slutar fungera.
