name: Android Release Build (signed AAB for Play Store)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild native Android project
        run: |
          cd app
          npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_API_URL: https://veckis-production.up.railway.app
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuaGFuZGxpcy5hcHAk
          EXPO_PUBLIC_CLERK_GOOGLE_WEB_CLIENT_ID: 630229510172-1nb18ugbraqrrqqcqgvvhblonslccr4f.apps.googleusercontent.com
          EXPO_PUBLIC_CLERK_GOOGLE_ANDROID_CLIENT_ID: 630229510172-o5si76i2ce137204dtnbrjqbjmbccleq.apps.googleusercontent.com

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/app/release.keystore

      - name: Configure Gradle signing
        run: |
          cat >> app/android/gradle.properties << EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Patch build.gradle to use release signing config
        run: python3 .github/scripts/patch_gradle_signing.py

      - name: Build signed release AAB
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew bundleRelease -x lint -x lintVitalAnalyzeRelease
        env:
          _JAVA_OPTIONS: '-Xmx2g'

      - name: Find AAB
        id: aab
        run: |
          AAB=$(find app/android -name "*.aab" -type f | head -1)
          echo "aab=$AAB" >> $GITHUB_OUTPUT
          echo "Found: $AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: ${{ steps.aab.outputs.aab }}
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f app/android/app/release.keystore
